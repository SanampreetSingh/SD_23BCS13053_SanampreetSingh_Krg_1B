events {
    worker_connections ${WORKER_CONNECTIONS};
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

   # Uses DOCKER_RESOLVER from your .env
    resolver ${DOCKER_RESOLVER} valid=30s;

    upstream backend_server {
        # Uses BACKEND_PORT from your .env
        server backend:${BACKEND_PORT};
    }

   server {
        # Uses HTTP_PORT and DOMAIN_NAME from your .env
        listen ${HTTP_PORT};
        server_name ${DOMAIN_NAME};

   # 1. FRONTEND
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. BACKEND API
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. WEBSOCKET (Terminal)
        location /socket.io/ {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # --- DYNAMIC PREVIEWS (Zero-Config Strategy) ---

        # A. VITE MIME FIX: Specific catch for internal modules
        # This prevents Vite scripts from being served as HTML by routing them to the container root
        location ~ ^/preview/(?<user_id>[^/]+)/(?<vite_file>(@vite|@fs|src|node_modules)/.*)$ {
            auth_request /auth-verify;
            set $target_port $arg_port;
            if ($target_port = "") { 
                set $target_port 3000;
             }

            proxy_pass http://ide-user-$user_id:$target_port/$vite_file$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            # Ensures the container's content-type isn't overridden by accidental 404s
            proxy_hide_header Content-Type;
        }

        # B. Handle Bundler Internal Modules (@ paths)
        location ~ ^/preview/(?<user_id>[^/]+)/(?<internal_path>@.*)$ {
            auth_request /auth-verify;
            set $target_port $arg_port;
            if ($target_port = "") { 
                set $target_port 3000;
                 }

            proxy_pass http://ide-user-$user_id:$target_port/$internal_path$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        # C. Main Preview Path
        location ~ ^/preview/(?<user_id>[^/]+)(?<remaining_path>.*)$ {
            auth_request /auth-verify;
            set $target_port $arg_port;
            if ($target_port = "") { 
                set $target_port 3000;
                 }

            set $fixed_path $remaining_path;
            if ($fixed_path = "") { 
                set $fixed_path "/"; 
            }

            proxy_pass http://ide-user-$user_id:$target_port$fixed_path$is_args$args;
            
            # Inject base tag so user scripts resolve to this preview path
            sub_filter '<head>' '<head><base href="/preview/$user_id/">';
            sub_filter_once on;

            proxy_set_header Accept-Encoding ""; 
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Cookie $http_cookie;
            proxy_buffering off;
        }

        # 4. Auth Sub-request (Internal)
        location = /auth-verify {
            internal;
            proxy_pass http://backend_server/api/auth/verify-preview;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Target-User $user_id;
            proxy_set_header Cookie $http_cookie;
        }
    }
}